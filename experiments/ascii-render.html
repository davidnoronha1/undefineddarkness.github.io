<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII 3D Renderer</title>
<style>
  :root {
    --bg: #0b0b0b;
    --fg: #d8d8d8;
    --accent: #6cf27a;
    --panel: rgba(20, 20, 20, 0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  /* Braille and the octant blocks (Unicode 16, added 2024) aren't in most
     system fonts yet. LegacySymbols.woff2 is FairfaxHD subset down to just
     these ranges (assets_src/fonts/.tooling/subset_legacy_symbols.py) — a
     ~22KB file instead of FairfaxHD's full ~730KB, scoped via unicode-range
     so it only loads for these symbol codepoints and never touches
     ordinary Latin text. */
  @font-face {
    font-family: "Legacy Symbols";
    src: url("/assets/LegacySymbols.woff2") format("woff2");
    unicode-range: U+2580-259F, U+1FB00-1FBFF, U+1CC00-1CEBF, U+2800-28FF;
    font-display: swap;
  }
  #ascii {
    font-family: "Legacy Symbols", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    white-space: pre;
    line-height: 1;
    letter-spacing: 0;
    color: var(--fg);
    user-select: none;
    text-align: left;
  }
  #ascii-canvas {
    display: none;
    user-select: none;
  }

  a.back {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.85em;
    opacity: 0.6;
    z-index: 5;
  }
  a.back:hover { opacity: 1; }

  #panel {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    gap: 0.6em 1.1em;
    align-items: center;
    background: var(--panel);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.6em 1em;
    font-size: 0.78em;
    backdrop-filter: blur(6px);
    max-width: 92vw;
    z-index: 5;
  }
  #panel label {
    display: flex;
    align-items: center;
    gap: 0.4em;
    white-space: nowrap;
  }
  #panel input[type="range"] { width: 100px; }
  #panel button, #panel .file-btn {
    background: #1c1c1c;
    color: var(--fg);
    border: 1px solid #3a3a3a;
    border-radius: 5px;
    padding: 0.35em 0.7em;
    font-size: 1em;
    cursor: pointer;
    font-family: inherit;
  }
  #panel button:hover, #panel .file-btn:hover { border-color: var(--accent); }
  #panel input[type="file"] { display: none; }

  #hud {
    position: fixed;
    top: 14px;
    right: 16px;
    font-size: 0.75em;
    opacity: 0.55;
    z-index: 5;
    text-align: right;
  }

  #drop-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.9em;
    opacity: 0.35;
    pointer-events: none;
    z-index: 4;
  }

  body.dragover #stage { outline: 2px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>

<a class="back" href="./index.html">&larr; experiments</a>
<div id="hud">
  <div id="fps">-- fps</div>
  <div id="grid-size"></div>
</div>
<div id="drop-hint">drop a .obj file anywhere, or use the panel below</div>

<div id="stage">
  <pre id="ascii"></pre>
  <canvas id="ascii-canvas"></canvas>
</div>

<div id="panel">
  <label class="file-btn">
    load .obj
    <input id="file-input" type="file" accept=".obj">
  </label>
  <label>cols <input id="cols" type="range" min="40" max="220" value="110"></label>
  <label>style
    <select id="style">
      <option value="octant" selected>octant (gray)</option>
      <option value="braille">braille</option>
      <option value="text">characters</option>
    </select>
  </label>
  <label id="ramp-label">ramp
    <select id="ramp">
      <option value="simple">simple</option>
      <option value="detailed" selected>detailed</option>
      <option value="blocks">blocks</option>
    </select>
  </label>
  <label><input id="auto-rotate" type="checkbox" checked> auto-rotate</label>
  <label><input id="invert" type="checkbox"> invert</label>
  <button id="reset">reset view</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.179.1",
    "three/addons/": "https://esm.sh/three@0.179.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

const RAMPS = {
  simple: " .:-=+*#%@",
  detailed: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
  blocks: " ░▒▓█"
};

// Unicode braille (U+2800-U+28FF) packs an 8-dot (2x4) sub-grid into a
// single monospace glyph, so each terminal cell carries 8x the spatial
// detail of a plain ASCII-ramp cell at the same character resolution.
// Bit layout per the Unicode braille dot numbering:
//   (row,col) -> bit    0,0->0  0,1->3
//                1,0->1  1,1->4
//                2,0->2  2,1->5
//                3,0->6  3,1->7
const BRAILLE_BIT = [
  [0, 3],
  [1, 4],
  [2, 5],
  [6, 7]
];
// 4x4 Bayer ordered-dither matrix, so gradients read as dot density
// instead of hard-banding at the per-dot on/off threshold.
const BAYER4 = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5]
].map((row) => row.map((v) => (v + 0.5) / 16));

// Octants use the same 2x4 sub-grid as braille, but as filled blocks
// instead of dots, and (unlike braille) can carry a real grayscale text
// color per cell — so shape comes from the dithered dot pattern and
// smooth shading comes from the fill color, closer to true image
// resolution than either ramp text or plain braille.
//
// Octant cell numbering (row-major, per the Unicode proposal):
//   1 2
//   3 4
//   5 6
//   7 8
// Table below is indexed by mask (bit i-1 = cell i on/off) -> codepoint,
// generated directly from the Unicode 16 UCD (UnicodeData.txt): every
// "BLOCK OCTANT-*" name plus the pre-existing blank/full/half/quadrant/
// quarter-band characters those patterns collapse to. Six of the 256
// patterns (a lone corner cell, and its near-complement) have no
// Unicode glyph at all — those are snapped to blank / full block.
const OCTANT_BIT = [
  [0, 1],
  [2, 3],
  [4, 5],
  [6, 7]
];
const OCTANT_CODEPOINTS = [
  0x0020, 0x0020, 0x0020, 0x1FB82, 0x1CD00, 0x2598, 0x1CD01, 0x1CD02,
  0x1CD03, 0x1CD04, 0x259D, 0x1CD05, 0x1CD06, 0x1CD07, 0x1CD08, 0x2580,
  0x1CD09, 0x1CD0A, 0x1CD0B, 0x1CD0C, 0x1FBE6, 0x1CD0D, 0x1CD0E, 0x1CD0F,
  0x1CD10, 0x1CD11, 0x1CD12, 0x1CD13, 0x1CD14, 0x1CD15, 0x1CD16, 0x1CD17,
  0x1CD18, 0x1CD19, 0x1CD1A, 0x1CD1B, 0x1CD1C, 0x1CD1D, 0x1CD1E, 0x1CD1F,
  0x1FBE7, 0x1CD20, 0x1CD21, 0x1CD22, 0x1CD23, 0x1CD24, 0x1CD25, 0x1CD26,
  0x1CD27, 0x1CD28, 0x1CD29, 0x1CD2A, 0x1CD2B, 0x1CD2C, 0x1CD2D, 0x1CD2E,
  0x1CD2F, 0x1CD30, 0x1CD31, 0x1CD32, 0x1CD33, 0x1CD34, 0x1CD35, 0x2588,
  0x0020, 0x1CD36, 0x1CD37, 0x1CD38, 0x1CD39, 0x1CD3A, 0x1CD3B, 0x1CD3C,
  0x1CD3D, 0x1CD3E, 0x1CD3F, 0x1CD40, 0x1CD41, 0x1CD42, 0x1CD43, 0x1CD44,
  0x2596, 0x1CD45, 0x1CD46, 0x1CD47, 0x1CD48, 0x258C, 0x1CD49, 0x1CD4A,
  0x1CD4B, 0x1CD4C, 0x259E, 0x1CD4D, 0x1CD4E, 0x1CD4F, 0x1CD50, 0x259B,
  0x1CD51, 0x1CD52, 0x1CD53, 0x1CD54, 0x1CD55, 0x1CD56, 0x1CD57, 0x1CD58,
  0x1CD59, 0x1CD5A, 0x1CD5B, 0x1CD5C, 0x1CD5D, 0x1CD5E, 0x1CD5F, 0x1CD60,
  0x1CD61, 0x1CD62, 0x1CD63, 0x1CD64, 0x1CD65, 0x1CD66, 0x1CD67, 0x1CD68,
  0x1CD69, 0x1CD6A, 0x1CD6B, 0x1CD6C, 0x1CD6D, 0x1CD6E, 0x1CD6F, 0x1CD70,
  0x0020, 0x1CD71, 0x1CD72, 0x1CD73, 0x1CD74, 0x1CD75, 0x1CD76, 0x1CD77,
  0x1CD78, 0x1CD79, 0x1CD7A, 0x1CD7B, 0x1CD7C, 0x1CD7D, 0x1CD7E, 0x1CD7F,
  0x1CD80, 0x1CD81, 0x1CD82, 0x1CD83, 0x1CD84, 0x1CD85, 0x1CD86, 0x1CD87,
  0x1CD88, 0x1CD89, 0x1CD8A, 0x1CD8B, 0x1CD8C, 0x1CD8D, 0x1CD8E, 0x1CD8F,
  0x2597, 0x1CD90, 0x1CD91, 0x1CD92, 0x1CD93, 0x259A, 0x1CD94, 0x1CD95,
  0x1CD96, 0x1CD97, 0x2590, 0x1CD98, 0x1CD99, 0x1CD9A, 0x1CD9B, 0x259C,
  0x1CD9C, 0x1CD9D, 0x1CD9E, 0x1CD9F, 0x1CDA0, 0x1CDA1, 0x1CDA2, 0x1CDA3,
  0x1CDA4, 0x1CDA5, 0x1CDA6, 0x1CDA7, 0x1CDA8, 0x1CDA9, 0x1CDAA, 0x1CDAB,
  0x2582, 0x1CDAC, 0x1CDAD, 0x1CDAE, 0x1CDAF, 0x1CDB0, 0x1CDB1, 0x1CDB2,
  0x1CDB3, 0x1CDB4, 0x1CDB5, 0x1CDB6, 0x1CDB7, 0x1CDB8, 0x1CDB9, 0x1CDBA,
  0x1CDBB, 0x1CDBC, 0x1CDBD, 0x1CDBE, 0x1CDBF, 0x1CDC0, 0x1CDC1, 0x1CDC2,
  0x1CDC3, 0x1CDC4, 0x1CDC5, 0x1CDC6, 0x1CDC7, 0x1CDC8, 0x1CDC9, 0x1CDCA,
  0x1CDCB, 0x1CDCC, 0x1CDCD, 0x1CDCE, 0x1CDCF, 0x1CDD0, 0x1CDD1, 0x1CDD2,
  0x1CDD3, 0x1CDD4, 0x1CDD5, 0x1CDD6, 0x1CDD7, 0x1CDD8, 0x1CDD9, 0x1CDDA,
  0x2584, 0x1CDDB, 0x1CDDC, 0x1CDDD, 0x1CDDE, 0x2599, 0x1CDDF, 0x1CDE0,
  0x1CDE1, 0x1CDE2, 0x259F, 0x1CDE3, 0x2588, 0x1CDE4, 0x1CDE5, 0x2588
];
const OCTANT_GLYPHS = OCTANT_CODEPOINTS.map((cp) => String.fromCodePoint(cp));

const asciiEl = document.getElementById("ascii");
const canvasEl = document.getElementById("ascii-canvas");
const canvasCtx = canvasEl.getContext("2d");
const stage = document.getElementById("stage");
const fpsEl = document.getElementById("fps");
const gridSizeEl = document.getElementById("grid-size");
const colsInput = document.getElementById("cols");
const styleSelect = document.getElementById("style");
const rampLabel = document.getElementById("ramp-label");
const rampSelect = document.getElementById("ramp");
const autoRotateInput = document.getElementById("auto-rotate");
const invertInput = document.getElementById("invert");
const resetBtn = document.getElementById("reset");
const fileInput = document.getElementById("file-input");

function syncStyleUi() {
  const isOctant = styleSelect.value === "octant";
  rampLabel.style.display = styleSelect.value === "text" ? "flex" : "none";
  asciiEl.style.display = isOctant ? "none" : "block";
  canvasEl.style.display = isOctant ? "block" : "none";
}
syncStyleUi();

// --- three.js setup (fully offscreen — no canvas ever hits the DOM) ---
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: false });
renderer.setPixelRatio(1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 6);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(4, 6, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(-5, -3, -4);
scene.add(rim);

const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
const pivot = new THREE.Group();
scene.add(pivot);
let mesh = null;

let renderTarget = null;
let pixelBuffer = null;
let termCols = 0, termRows = 0; // character grid (what the user sees as "cols")
let ptCols = 0, ptRows = 0;     // pixel/sub-dot grid actually rendered & read back

function setModel(geometry) {
  if (mesh) {
    pivot.remove(mesh);
    mesh.geometry.dispose();
  }
  geometry.computeVertexNormals();
  geometry.center();

  const box = new THREE.Box3().setFromObject(new THREE.Mesh(geometry));
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  geometry.scale(2 / maxDim, 2 / maxDim, 2 / maxDim);

  mesh = new THREE.Mesh(geometry, material);
  pivot.add(mesh);
  pivot.rotation.set(0, 0, 0);
}

// Build a default demo mesh and round-trip it through a real OBJ
// string + OBJLoader, so the "renders an OBJ file" path is exercised
// even before the user picks their own file.
function objFromGeometry(geometry) {
  const pos = geometry.attributes.position;
  const index = geometry.index;
  let lines = [];
  for (let i = 0; i < pos.count; i++) {
    lines.push(`v ${pos.getX(i).toFixed(5)} ${pos.getY(i).toFixed(5)} ${pos.getZ(i).toFixed(5)}`);
  }
  const tri = index ? index.array : null;
  const count = tri ? tri.length : pos.count;
  for (let i = 0; i < count; i += 3) {
    const a = (tri ? tri[i] : i) + 1;
    const b = (tri ? tri[i + 1] : i + 1) + 1;
    const c = (tri ? tri[i + 2] : i + 2) + 1;
    lines.push(`f ${a} ${b} ${c}`);
  }
  return lines.join("\n");
}

function loadDefaultModel() {
  const demoGeo = new THREE.TorusKnotGeometry(0.7, 0.25, 140, 24);
  const objText = objFromGeometry(demoGeo);
  const obj = new OBJLoader().parse(objText);
  const loadedMesh = obj.children.find((c) => c.isMesh);
  setModel(loadedMesh.geometry);
}

function loadObjText(text) {
  const obj = new OBJLoader().parse(text);
  const loadedMesh = obj.children.find((c) => c.isMesh);
  if (!loadedMesh) return;
  const merged = new THREE.BufferGeometry();
  merged.setAttribute("position", loadedMesh.geometry.attributes.position);
  if (loadedMesh.geometry.index) merged.setIndex(loadedMesh.geometry.index);
  setModel(merged);
}

loadDefaultModel();

// Canvas fillText doesn't reliably trigger @font-face fetching on its own
// the way rendering DOM text does, and #ascii (the one element styled with
// "Legacy Symbols") stays display:none in octant/braille mode — so nothing
// guarantees the font is requested before the first frame draws. Request it
// explicitly so the very first frame already has the real octant glyphs
// instead of a momentary fallback-font flash.
document.fonts.load('16px "Legacy Symbols"').catch(() => {});


// --- interaction: drag to rotate, wheel to zoom (mirrors wireframe-model-viewer.ts) ---
let isDragging = false, prevX = 0, prevY = 0;
const rotation = new THREE.Quaternion();
const targetRotation = new THREE.Quaternion();
let distance = 6, targetDistance = 6;

stage.addEventListener("pointerdown", (e) => {
  isDragging = true;
  prevX = e.clientX; prevY = e.clientY;
  stage.classList.add("dragging");
  autoRotateInput.checked = false;
});
window.addEventListener("pointerup", () => {
  isDragging = false;
  stage.classList.remove("dragging");
});
window.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  prevX = e.clientX; prevY = e.clientY;
  const speed = 0.008;
  const delta = new THREE.Quaternion().setFromEuler(new THREE.Euler(dy * speed, dx * speed, 0, "XYZ"));
  targetRotation.multiplyQuaternions(delta, targetRotation);
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  targetDistance = Math.max(2, Math.min(20, targetDistance * (1 + (e.deltaY > 0 ? 0.1 : -0.1))));
}, { passive: false });

resetBtn.addEventListener("click", () => {
  targetRotation.identity();
  targetDistance = 6;
});

// --- file loading ---
function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith(".obj")) return;
  const reader = new FileReader();
  reader.onload = () => loadObjText(reader.result);
  reader.readAsText(file);
}
fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));

["dragover", "dragenter"].forEach((evt) =>
  window.addEventListener(evt, (e) => { e.preventDefault(); document.body.classList.add("dragover"); })
);
["dragleave", "drop"].forEach((evt) =>
  window.addEventListener(evt, (e) => { e.preventDefault(); document.body.classList.remove("dragover"); })
);
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  handleFile(file);
});

// --- grid sizing: measure actual monospace glyph metrics so the ASCII
// grid fills the viewport without distortion, then size the render
// target to match exactly (no separate downsample pass needed). ---
const measureCanvas = document.createElement("canvas");
const measureCtx = measureCanvas.getContext("2d");

const dpr = Math.min(window.devicePixelRatio || 1, 2);
let fontSize = 16, charWidth = 9, cssW = 0, cssH = 0;

function computeGrid() {
  const cols = parseInt(colsInput.value, 10);
  const style = styleSelect.value;
  const fontFamily = getComputedStyle(asciiEl).fontFamily;
  const testSize = 100;
  measureCtx.font = `${testSize}px ${fontFamily}`;
  const charWidthRatio = measureCtx.measureText("M").width / testSize;

  const vw = window.innerWidth * 0.94;
  const vh = window.innerHeight * 0.8;

  fontSize = vw / (cols * charWidthRatio);
  charWidth = fontSize * charWidthRatio;
  const rows = Math.max(1, Math.floor(vh / fontSize));

  asciiEl.style.fontSize = `${fontSize}px`;
  asciiEl.style.lineHeight = "1";

  cssW = cols * charWidth; cssH = rows * fontSize;
  canvasEl.style.width = `${cssW}px`;
  canvasEl.style.height = `${cssH}px`;
  canvasEl.width = Math.round(cssW * dpr);
  canvasEl.height = Math.round(cssH * dpr);
  canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvasCtx.font = `${fontSize}px ${fontFamily}`;
  canvasCtx.textBaseline = "top";

  // Braille dots and octant blocks both pack a 2x4 sub-cell grid, so the
  // actual render target (and readback) needs that many more samples
  // per character cell than a plain ramp-text cell does.
  const subgrid = style === "braille" || style === "octant";
  const newPtCols = subgrid ? cols * 2 : cols;
  const newPtRows = subgrid ? rows * 4 : rows;

  termCols = cols;
  termRows = rows;

  if (newPtCols !== ptCols || newPtRows !== ptRows) {
    ptCols = newPtCols;
    ptRows = newPtRows;
    if (renderTarget) renderTarget.dispose();
    renderTarget = new THREE.WebGLRenderTarget(ptCols, ptRows, { depthBuffer: true, stencilBuffer: false });
    pixelBuffer = new Uint8Array(ptCols * ptRows * 4);
    camera.aspect = ptCols / ptRows;
    camera.updateProjectionMatrix();
    gridSizeEl.textContent = `${termCols} x ${termRows}${subgrid ? ` (${ptCols}x${ptRows} dots)` : ""}`;
  }
}
computeGrid();
window.addEventListener("resize", computeGrid);
colsInput.addEventListener("input", computeGrid);
styleSelect.addEventListener("change", () => { syncStyleUi(); computeGrid(); });

// --- render loop ---
let rowStrings = [];
let lastFpsT = performance.now();
let frames = 0;

function render() {
  requestAnimationFrame(render);

  if (autoRotateInput.checked) {
    const spin = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0.012, 0));
    targetRotation.multiplyQuaternions(spin, targetRotation);
  }
  rotation.slerp(targetRotation, 0.15);
  pivot.setRotationFromQuaternion(rotation);
  distance += (targetDistance - distance) * 0.15;
  camera.position.set(0, 0, distance);
  camera.lookAt(0, 0, 0);

  renderer.setRenderTarget(renderTarget);
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(renderTarget, 0, 0, ptCols, ptRows, pixelBuffer);
  renderer.setRenderTarget(null);

  const invert = invertInput.checked;

  // Always raw (never flipped by invert): dot/glyph density must stay
  // "background sparse, model dense" in both modes, exactly like swapping
  // ink/paper on real paper leaves the drawing itself unchanged. Only the
  // octant style's per-cell color tone flips for invert (below) — ramp and
  // braille represent brightness purely through density, and the empty
  // background pattern (index/bits 0, i.e. blank) needs to stay blank so
  // it doesn't paint over the page background.
  function luminanceAt(px, py) {
    // render target rows are bottom-up; flip while reading
    const srcY = ptRows - 1 - py;
    const i = (srcY * ptCols + px) * 4;
    return (pixelBuffer[i] * 0.299 + pixelBuffer[i + 1] * 0.587 + pixelBuffer[i + 2] * 0.114) / 255;
  }

  const style = styleSelect.value;
  if (rowStrings.length !== termRows) rowStrings = new Array(termRows);

  if (style === "octant") {
    // Shape comes from the dithered 2x4 on/off block pattern (exactly
    // like braille below); tone comes from a real per-cell grayscale
    // fill color, averaged over the same 8 sub-samples — so this style
    // carries far more visual information per glyph than either plain
    // ramp text or dot-only braille.
    canvasCtx.clearRect(0, 0, cssW, cssH);
    const GRAY_STEP = 4; // quantize so nearby cells merge into one fillText run
    for (let ty = 0; ty < termRows; ty++) {
      const y = ty * fontSize;
      let runStart = 0, runGray = -1, runStr = "";
      for (let tx = 0; tx < termCols; tx++) {
        let bits = 0, sum = 0;
        for (let dy = 0; dy < 4; dy++) {
          const py = ty * 4 + dy;
          const bayerRow = BAYER4[dy];
          for (let dx = 0; dx < 2; dx++) {
            const px = tx * 2 + dx;
            const lum = luminanceAt(px, py);
            sum += lum;
            if (lum > bayerRow[dx]) bits |= 1 << OCTANT_BIT[dy][dx];
          }
        }
        const avgLum = invert ? 1 - sum / 8 : sum / 8;
        const gray = Math.round(avgLum * 255 / GRAY_STEP) * GRAY_STEP;
        const glyph = OCTANT_GLYPHS[bits];
        if (gray !== runGray) {
          if (runStr) {
            canvasCtx.fillStyle = `rgb(${runGray},${runGray},${runGray})`;
            canvasCtx.fillText(runStr, runStart * charWidth, y);
          }
          runStart = tx; runGray = gray; runStr = glyph;
        } else {
          runStr += glyph;
        }
      }
      if (runStr) {
        canvasCtx.fillStyle = `rgb(${runGray},${runGray},${runGray})`;
        canvasCtx.fillText(runStr, runStart * charWidth, y);
      }
    }
  } else if (style === "braille") {
    for (let ty = 0; ty < termRows; ty++) {
      let row = "";
      for (let tx = 0; tx < termCols; tx++) {
        let bits = 0;
        for (let dy = 0; dy < 4; dy++) {
          const py = ty * 4 + dy;
          const bayerRow = BAYER4[dy];
          for (let dx = 0; dx < 2; dx++) {
            const px = tx * 2 + dx;
            const lum = luminanceAt(px, py);
            if (lum > bayerRow[dx]) bits |= 1 << BRAILLE_BIT[dy][dx];
          }
        }
        row += String.fromCharCode(0x2800 + bits);
      }
      rowStrings[ty] = row;
    }
    asciiEl.textContent = rowStrings.join("\n");
  } else {
    const ramp = RAMPS[rampSelect.value];
    const rampLen = ramp.length - 1;
    for (let ty = 0; ty < termRows; ty++) {
      let row = "";
      for (let tx = 0; tx < termCols; tx++) {
        const lum = luminanceAt(tx, ty);
        row += ramp[Math.round(lum * rampLen)];
      }
      rowStrings[ty] = row;
    }
    asciiEl.textContent = rowStrings.join("\n");
  }

  stage.style.background = invert ? "#f0f0f0" : "";
  asciiEl.style.color = invert ? "#111" : "";

  frames++;
  const now = performance.now();
  if (now - lastFpsT >= 500) {
    fpsEl.textContent = `${Math.round((frames * 1000) / (now - lastFpsT))} fps`;
    frames = 0;
    lastFpsT = now;
  }
}
requestAnimationFrame(render);
</script>
</body>
</html>
